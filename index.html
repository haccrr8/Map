<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Satellite Location Tracker & Hologram Connect</title>
  
  <!-- Leaflet CSS (Satellite Map Engine) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
    
    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* Control Panel Overlay UI */
    .ui-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 15px;
      border-radius: 10px;
      max-width: 320px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .ui-panel h3 { font-size: 16px; margin-bottom: 10px; color: #00f3ff; }
    .ui-panel p { font-size: 12px; margin-bottom: 10px; color: #ccc; }
    
    .btn {
      background: #00f3ff;
      color: #000;
      border: none;
      padding: 10px 12px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 8px;
    }
    
    .btn-secondary {
      background: #ff0055;
      color: #fff;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 5px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
    }

    .status-box {
      font-size: 12px;
      padding: 6px;
      background: #111;
      border-left: 3px solid #00f3ff;
      margin-top: 5px;
    }

    /* ---------------------------------------------------- */
    /* 3D HOLOGRAM ANIMATION STYLES                         */
    /* ---------------------------------------------------- */
    .hologram-wrapper {
      position: relative;
      width: 60px;
      height: 60px;
    }

    .holo-cone {
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 35px solid transparent;
      border-right: 35px solid transparent;
      border-top: 90px solid rgba(0, 243, 255, 0.3);
      filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.9));
      animation: holo-flicker 1.5s infinite alternate ease-in-out;
      pointer-events: none;
    }

    .holo-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50px;
      height: 50px;
      margin-top: -25px;
      margin-left: -25px;
      border: 2px dashed #00f3ff;
      border-radius: 50%;
      box-shadow: 0 0 15px #00f3ff, inset 0 0 15px #00f3ff;
      animation: holo-spin 4s linear infinite;
    }

    .holo-core {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      margin-top: -6px;
      margin-left: -6px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 20px #00f3ff, 0 0 40px #00f3ff;
      animation: holo-pulse 1.2s infinite ease-in-out;
    }

    @keyframes holo-spin {
      0% { transform: rotate(0deg) rotateX(60deg); }
      100% { transform: rotate(360deg) rotateX(60deg); }
    }

    @keyframes holo-pulse {
      0%, 100% { transform: scale(0.8); opacity: 0.7; }
      50% { transform: scale(1.4); opacity: 1; }
    }

    @keyframes holo-flicker {
      0% { opacity: 0.6; transform: translateX(-50%) scaleX(0.9); }
      50% { opacity: 1; transform: translateX(-50%) scaleX(1.1); }
      100% { opacity: 0.7; transform: translateX(-50%) scaleX(0.95); }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="ui-panel">
    <h3>HOLOGRAM GPS TRACKER</h3>
    <p>अपनी लाइव सैटलाइट लोकेशन शेयर करें और नीली लाइन से कनेक्ट हों।</p>
    
    <div class="status-box" id="status">आपकी ID बन रही है...</div>
    <br>

    <button class="btn" onclick="copyShareLink()">🔗 शेयर करने वाला लिंक कॉपी करें</button>
    
    <hr style="border-color: #444; margin: 10px 0;">
    
    <p>या दूसरे की ID डालकर कनेक्ट करें:</p>
    <input type="text" id="peer-id-input" placeholder="यहाँ Peer ID डालें">
    <button class="btn btn-secondary" onclick="connectToPeer()">📡 डायरेक्ट कनेक्ट करें</button>
  </div>

  <!-- External Libraries -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  
  <script>
    // 1. Google Satellite View Layers
    const map = L.map('map').setView([20.5937, 78.9629], 5);

    // High-Resolution Satellite Map (Real Trees, Houses, Buildings)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19
    }).addTo(map);

    // Street Labels Overlay
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(map);

    // Variables
    let myLocation = null;
    let myMarker = null;
    let peerMarker = null;
    let connectionLine = null;
    let peer = null;
    let conn = null;

    const statusEl = document.getElementById('status');

    // 2. Custom Hologram Marker Icon
    const customHologramIcon = L.divIcon({
      className: 'custom-holo-marker',
      html: `
        <div class="hologram-wrapper">
          <div class="holo-cone"></div>
          <div class="holo-ring"></div>
          <div class="holo-core"></div>
        </div>
      `,
      iconSize: [60, 60],
      iconAnchor: [30, 30]
    });

    // 3. Real-time GPS Tracking
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          myLocation = [lat, lng];

          if (!myMarker) {
            myMarker = L.marker(myLocation, { icon: customHologramIcon })
              .addTo(map)
              .bindPopup("<b>HOLOGRAM AVATAR (YOU)</b>")
              .openPopup();
            
            map.setView(myLocation, 17); // Closeup Satellite Zoom
          } else {
            myMarker.setLatLng(myLocation);
          }

          // Send real-time coords to connected peer
          if (conn && conn.open) {
            conn.send({ type: 'location', coords: myLocation });
          }

          updateConnectionLine();
        },
        (error) => {
          alert("कृपया अपने फोन का GPS ऑन करें और Location Permission दें!");
          statusEl.innerText = "GPS Permission नहीं मिली।";
        },
        { enableHighAccuracy: true, maximumAge: 0 }
      );
    } else {
      alert("आपका ब्राउज़र Geolocation सपोर्ट नहीं करता।");
    }

    // 4. PeerJS Connectivity
    peer = new Peer();

    peer.on('open', (id) => {
      statusEl.innerText = `आपकी ID: ${id}`;
      
      const urlParams = new URLSearchParams(window.location.search);
      const connectId = urlParams.get('connect');
      if (connectId) {
        document.getElementById('peer-id-input').value = connectId;
        setTimeout(() => connectToPeer(), 1000);
      }
    });

    peer.on('connection', (incomingConn) => {
      conn = incomingConn;
      setupConnection();
    });

    function connectToPeer() {
      const peerId = document.getElementById('peer-id-input').value.trim();
      if (!peerId) return alert("कृपया साथी की ID डालें!");
      
      statusEl.innerText = "कनेक्ट हो रहा है...";
      conn = peer.connect(peerId);
      setupConnection();
    }

    function setupConnection() {
      conn.on('open', () => {
        statusEl.style.borderLeftColor = "#00ff66";
        statusEl.innerText = "सफलतापूर्वक कनेक्ट हो गए!";
        
        if (myLocation) {
          conn.send({ type: 'location', coords: myLocation });
        }
      });

      conn.on('data', (data) => {
        if (data.type === 'location') {
          const peerCoords = data.coords;

          if (!peerMarker) {
            peerMarker = L.marker(peerCoords, { icon: customHologramIcon })
              .addTo(map)
              .bindPopup("<b>साथी (PARTNER)</b>")
              .openPopup();
          } else {
            peerMarker.setLatLng(peerCoords);
          }

          updateConnectionLine();
        }
      });

      conn.on('close', () => {
        statusEl.innerText = "कनेक्शन कट गया।";
      });
    }

    // 5. Draw Glowing Blue Line Between Both Holograms
    function updateConnectionLine() {
      if (myMarker && peerMarker) {
        const p1 = myMarker.getLatLng();
        const p2 = peerMarker.getLatLng();

        const latlngs = [
          [p1.lat, p1.lng],
          [p2.lat, p2.lng]
        ];

        if (!connectionLine) {
          connectionLine = L.polyline(latlngs, {
            color: '#00f3ff',
            weight: 5,
            opacity: 0.9,
            dashArray: '8, 12'
          }).addTo(map);
        } else {
          connectionLine.setLatLngs(latlngs);
        }

        map.fitBounds(L.latLngBounds([p1, p2]), { padding: [60, 60] });
      }
    }

    // Copy Share Link
    function copyShareLink() {
      if (!peer || !peer.id) return alert("ID बन रही है, 2 सेकंड बाद दबाएं।");
      
      const shareUrl = `${window.location.origin}${window.location.pathname}?connect=${peer.id}`;
      navigator.clipboard.writeText(shareUrl);
      alert("लिंक कॉपी हो गया! इसे अपने दोस्त को भेजें। जब वो खोलेगा तो आपका और उसका होलोग्राम नीली लाइन से कनेक्ट हो जाएगा।");
    }
  </script>
</body>
</html>
