<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHERIS // Global Hologram Matrix</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; background: #010409; }
    
    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; filter: contrast(1.25) saturate(1.4) brightness(1.1); }

    /* --- FUTURISTIC HUD CONTROL PANEL --- */
    .ui-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: rgba(2, 6, 15, 0.9);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(0, 243, 255, 0.5);
      color: #fff;
      padding: 16px;
      border-radius: 14px;
      width: 360px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.9), inset 0 0 25px rgba(0, 243, 255, 0.15);
    }

    .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .ui-panel h3 { font-size: 14px; color: #00f3ff; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 800; }
    .live-dot { width: 9px; height: 9px; background: #00ff66; border-radius: 50%; box-shadow: 0 0 12px #00ff66; animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .ui-panel p { font-size: 11px; color: #8ba2b8; margin-bottom: 8px; line-height: 1.3; }

    .id-display {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(0, 243, 255, 0.3);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
      color: #00f3ff;
      word-break: break-all;
      margin-bottom: 8px;
    }

    .btn {
      background: linear-gradient(135deg, #00f3ff, #0066ff);
      color: #000;
      border: none;
      padding: 10px;
      font-weight: 800;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
      transition: 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: linear-gradient(135deg, #ff0055, #990033); color: #fff; box-shadow: 0 0 15px rgba(255, 0, 85, 0.4); }

    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 6px;
      border-radius: 6px;
      border: 1px solid rgba(0, 243, 255, 0.3);
      background: rgba(0, 0, 0, 0.7);
      color: #00f3ff;
      font-size: 11px;
      outline: none;
    }
    input[type="text"]::placeholder { color: #4a6075; }

    /* --- TARGET TELEMETRY / LOCATION INFO BOX --- */
    .telemetry-box {
      margin-top: 8px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(0, 243, 255, 0.25);
      border-radius: 8px;
      padding: 8px;
      font-size: 10px;
      font-family: monospace;
      color: #cbd5e1;
      max-height: 90px;
      overflow-y: auto;
    }
    .telemetry-box span { color: #00f3ff; }

    /* --- HIGH-END 3D PHONE + HOLOGRAM MARKER --- */
    .holo-node-container {
      position: relative;
      width: 90px;
      height: 90px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 3D Phone Hologram Badge */
    .phone-holo-badge {
      position: absolute;
      top: -10px;
      background: rgba(0, 243, 255, 0.15);
      border: 1px solid #00f3ff;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 9px;
      color: #00f3ff;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
      white-space: nowrap;
      animation: badge-float 1.5s infinite alternate ease-in-out;
    }

    .holo-projection-beam {
      position: absolute;
      bottom: 25px;
      width: 0;
      height: 0;
      border-left: 25px solid transparent;
      border-right: 25px solid transparent;
      border-bottom: 70px solid rgba(0, 243, 255, 0.3);
      filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.8));
    }

    .holo-base-ring {
      position: absolute;
      bottom: 5px;
      width: 50px;
      height: 25px;
      border: 2px dashed #00f3ff;
      border-radius: 50%;
      box-shadow: 0 0 15px #00f3ff;
      animation: ring-spin 3s linear infinite;
    }

    .holo-core-dot {
      position: absolute;
      bottom: 15px;
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 20px #00f3ff, 0 0 40px #00ff66;
      animation: core-pulse 1s infinite ease-in-out;
    }

    @keyframes ring-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes core-pulse { 0%, 100% { transform: scale(0.8); } 50% { transform: scale(1.3); } }
    @keyframes badge-float { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- HUD Control Panel -->
  <div class="ui-panel">
    <div class="panel-header">
      <h3>🌍 GLOBAL ORBIT MATRIX</h3>
      <div class="live-dot" id="live-indicator"></div>
    </div>
    <p>सैटेलाइट पृथ्वी से लाइव ट्रैकिंग और डिवाइस लिंकिंग।</p>
    
    <div class="id-display" id="my-id-text">आईडी लोड हो रही है...</div>

    <button class="btn" onclick="copyShareLink()">🔗 शेयर लिंक कॉपी करें</button>
    
    <div>
      <input type="text" id="peer-id-input" placeholder="साथी की ID यहाँ दर्ज करें...">
      <button class="btn btn-secondary" onclick="connectToPeer()">⚡ कनेक्ट करें</button>
    </div>

    <!-- Live Telemetry / Location Data Panel -->
    <div class="telemetry-box" id="telemetry-data">
      📡 GPS स्टेटस: <span>पृथ्वी से ज़ूम इन हो रहा है...</span>
    </div>
  </div>

  <!-- Leaflet & PeerJS Libraries -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  
  <script>
    // 1. High-Res Satellite Map Setup (Globe View Simulation)
    // Start zoomed out globally (Earth view) so it zooms into user location dynamically
    const map = L.map('map', { zoomControl: false }).setView([20.5937, 78.9629], 3);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Esri Satellite'
    }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(map);

    let myLocation = null;
    let myMarker = null;
    let peerMarker = null;
    let connectionLine = null;
    let peer = null;
    let conn = null;
    let hasZoomedToUser = false;

    const idTextEl = document.getElementById('my-id-text');
    const telemetryEl = document.getElementById('telemetry-data');

    // 2. Custom Phone Hologram Icon Generator
    function createPhoneHologramIcon(labelColor, deviceName) {
      return L.divIcon({
        className: 'custom-holo-node',
        html: `
          <div class="holo-node-container">
            <div class="phone-holo-badge" style="border-color: ${labelColor}; color: ${labelColor};">📱 ${deviceName}</div>
            <div class="holo-projection-beam" style="border-bottom-color: ${labelColor};"></div>
            <div class="holo-base-ring" style="border-color: ${labelColor}; box-shadow: 0 0 15px ${labelColor};"></div>
            <div class="holo-core-dot" style="box-shadow: 0 0 20px ${labelColor}, 0 0 40px #fff;"></div>
          </div>
        `,
        iconSize: [90, 90],
        iconAnchor: [45, 80]
      });
    }

    // 3. Cinematic Zoom-in GPS Tracker
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          myLocation = [lat, lng];

          // Update Telemetry Info Box
          telemetryEl.innerHTML = `📍 <b>मेरा डिवाइस (YOU):</b><br>Lat: <span>${lat.toFixed(4)}</span> | Lng: <span>${lng.toFixed(4)}</span>`;

          if (!myMarker) {
            myMarker = L.marker(myLocation, { icon: createPhoneHologramIcon('#00f3ff', 'MY PHONE') })
              .addTo(map)
              .bindPopup("<b>YOUR PHONE (HOST)</b>")
              .openPopup();
            
            // Dynamic Cinematic Zoom-in from Earth View to Exact Location
            if (!hasZoomedToUser) {
              hasZoomedToUser = true;
              map.flyTo(myLocation, 17, {
                duration: 3, // 3 seconds smooth zoom
                easeLinearity: 0.25
              });
            }
          } else {
            myMarker.setLatLng(myLocation);
          }

          if (conn && conn.open) {
            conn.send({ type: 'location', coords: myLocation });
          }

          updateConnectionLine();
        },
        (error) => {
          telemetryEl.innerHTML = "⚠️ <b>GPS Error:</b> लोकेशन की अनुमति दें!";
          alert("कृपया अपने डिवाइस का GPS ऑन करें!");
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
      );
    } else {
      alert("आपका ब्राउज़र Geolocation सपोर्ट नहीं करता।");
    }

    // 4. PeerJS Connection Engine
    peer = new Peer();

    peer.on('open', (id) => {
      idTextEl.innerText = `मेरी ID: ${id}`;
      
      const urlParams = new URLSearchParams(window.location.search);
      const connectId = urlParams.get('connect');
      if (connectId) {
        document.getElementById('peer-id-input').value = connectId;
        setTimeout(() => connectToPeer(), 1000);
      }
    });

    peer.on('connection', (incomingConn) => {
      conn = incomingConn;
      setupConnection();
    });

    function connectToPeer() {
      const peerId = document.getElementById('peer-id-input').value.trim();
      if (!peerId) return alert("कृपया साथी की सही ID दर्ज करें!");
      
      telemetryEl.innerHTML = "📡 साथी से कनेक्ट हो रहे हैं...";
      conn = peer.connect(peerId);
      setupConnection();
    }

    function setupConnection() {
      if (!conn) return;

      conn.on('open', () => {
        telemetryEl.innerHTML = "✅ <b>लाइव कनेक्टेड!</b> नीली लाइन एक्टिव है।";
        if (myLocation) {
          conn.send({ type: 'location', coords: myLocation });
        }
      });

      conn.on('data', (data) => {
        if (data.type === 'location') {
          const peerCoords = data.coords;

          telemetryEl.innerHTML += `<br>🎯 <b>साथी (PARTNER):</b><br>Lat: <span>${peerCoords[0].toFixed(4)}</span> | Lng: <span>${peerCoords[1].toFixed(4)}</span>`;

          if (!peerMarker) {
            peerMarker = L.marker(peerCoords, { icon: createPhoneHologramIcon('#ff0055', 'PARTNER PHONE') })
              .addTo(map)
              .bindPopup("<b>PARTNER PHONE (TARGET)</b>")
              .openPopup();
          } else {
            peerMarker.setLatLng(peerCoords);
          }

          updateConnectionLine();
        }
      });

      conn.on('close', () => {
        telemetryEl.innerHTML = "❌ <b>कनेक्शन कट गया।</b>";
      });
    }

    // 5. Neon Connecting Line Between Both Phones
    function updateConnectionLine() {
      if (myMarker && peerMarker) {
        const p1 = myMarker.getLatLng();
        const p2 = peerMarker.getLatLng();

        const latlngs = [[p1.lat, p1.lng], [p2.lat, p2.lng]];

        if (!connectionLine) {
          connectionLine = L.polyline(latlngs, {
            color: '#00f3ff',
            weight: 5,
            opacity: 0.95,
            dashArray: '10, 10'
          }).addTo(map);
        } else {
          connectionLine.setLatLngs(latlngs);
        }

        map.fitBounds(L.latLngBounds([p1, p2]), { padding: [90, 90] });
      }
    }

    function copyShareLink() {
      if (!peer || !peer.id) return alert("ID तैयार हो रही है, 1 सेकंड रुकें।");
      
      const shareUrl = `${window.location.origin}${window.location.pathname}?connect=${peer.id}`;
      navigator.clipboard.writeText(shareUrl);
      alert("✨ लिंक कॉपी हो गया! इसे अपने दोस्त को भेजें। जैसे ही वो खोलेगा, पृथ्वी ज़ूम इन होकर दोनों फोन नीली लाइन से जुड़ जाएंगे!");
    }
  </script>
</body>
</html>
